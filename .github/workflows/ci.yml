name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npx expo lint

      - name: Contrast check
        run: npm run check:contrast

      - name: Accessibility scan
        run: npm run check:a11y

      - name: Hardcoded colour budget
        run: npm run check:colors

      - name: Style family budget
        run: npm run check:tokens
